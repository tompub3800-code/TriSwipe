name: Fabriquer TriSwipe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: |
          xcodebuild -version
          set +e
          xcodebuild -project TriSwipe.xcodeproj -target TriSwipe -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT="$PWD/build" build > build.log 2>&1
          status=$?
          echo "=== ERREURS ==="
          grep -E "error:" build.log | sort -u | head -60
          echo "=== FIN DU LOG ==="
          tail -15 build.log
          exit $status
      - name: Emballer en .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TriSwipe.app Payload/
          zip -qr TriSwipe.ipa Payload
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest TriSwipe.ipa -t "TriSwipe - dernière version" -n "Version ${{ github.run_number }}"
